name: Sync Download Directory to Gitee

on:
  schedule:
    - cron: '0 19 * * *'  # UTC 19:00（北京时间凌晨 3:00）
  workflow_dispatch:      # 允许手动触发

jobs:
  sync-download:
    runs-on: ubuntu-latest
    steps:
      # 步骤 1：仅检出 GitHub 仓库的 Download 目录
      - name: Checkout Download Directory
        uses: actions/checkout@v4
        with:
          sparse-checkout: |  # 启用稀疏检出模式，仅拉取指定路径
            Download/
          fetch-depth: 0      # 拉取完整历史记录

      # 步骤 2：镜像同步到 Gitee（仅限 Download 目录）
      - name: Mirror to Gitee
        uses: wearerequired/git-mirror-action@v1
        with:
          source-repo: "."  # 当前目录（仅包含 Download）
          destination-repo: "https://gitee.com/weijun_sun/zby.git"
          # 通过 URL 嵌入令牌（替代 destination-token 参数）
          destination-repo: "https://${{ secrets.8dff7e84e561e90a6f7423d9d09ea985 }}@gitee.com/weijun_sun/zby.git"
          dry-run: false    # 默认关闭（设为 true 可测试同步逻辑）
