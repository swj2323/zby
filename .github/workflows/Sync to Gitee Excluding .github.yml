name: Sync to Gitee Excluding .github

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'  # UTC 时间 19:00（北京时间凌晨 3:00）‌:ml-citation{ref="1,7" data="citationList"}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      # 步骤 1：选择性检出仓库内容（排除 .github）
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          sparse-checkout: |
            /*
            !.github  # 排除根目录的 .github 目录 ‌:ml-citation{ref="2,5" data="citationList"}

      # 步骤 2：创建临时目录并过滤文件
      - name: Prepare Sync Directory
        run: |
          mkdir -p sync_temp
          rsync -av --exclude='.github' --exclude='.git*' . sync_temp/  # 递归排除 .github 和 Git 元数据 ‌:ml-citation{ref="3,6" data="citationList"}
          cd sync_temp
          git init
          git config --local user.name "GitHub Actions"
          git config --local user.email "github-actions@github.com"

      # 步骤 3：提交并强制推送
      - name: Force Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}  # 需配置 Gitee 写入权限的 Token ‌:ml-citation{ref="1,8" data="citationList"}
        run: |
          cd sync_temp
          git add .
          git commit -m "Auto-sync excluding .github"
          git remote add gitee https://oauth2:$GITEE_TOKEN@gitee.com/weijun_sun/live.git
          git push gitee HEAD:master --force  # 强制覆盖目标分支 ‌:ml-citation{ref="4,8" data="citationList"}
