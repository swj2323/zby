name: Auto-Download
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"  # 每天 UTC 18 点执行

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - uses: actions/checkout@v4  # ‌:ml-citation{ref="2,4" data="citationList"}
      
      # 2. 设置工作目录
      - name: 创建下载目录
        run: mkdir -p Download

      # 3. 下载文件
      - name: 下载目标文件
        run: wget -O Download/ALL.m3u8 "https://iptv.wwkejishe.top/ALL.m3u8"

      # 4. 上传 Artifact
      - name: 上传文件为 Artifact
        uses: actions/upload-artifact@v4  # ‌:ml-citation{ref="1,2" data="citationList"}
        with:
          name: downloaded-files
          path: Download/ALL.m3u8  # 指定具体文件

      # 5. 提交文件到仓库（自动化提取）
      - name: 提交文件到仓库
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add Download/ALL.m3u8
          git commit -m "[skip ci] 自动更新 Artifact 文件"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
