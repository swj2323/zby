name: Auto-Download
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 每天 UTC 18 点执行

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: 设置工作目录
        run: mkdir -p Download

      - name: 下载文件
        run: wget -O Download/ALL.m3u8 "https://iptv.wwkejishe.top/ALL.m3u8"

      - name: 上传下载的文件为 Artifact
        uses: actions/upload-artifact@v4  # 更新到 v4 版本
        with:
          name: downloaded-files
          path: Download/ALL.m3u8  # 注意：这里应该指定具体的文件，而不是目录（除非你想上传整个目录）

