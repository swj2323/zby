name: Auto-Download  
on: 
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 每天 UTC 18 点执行 
jobs:  
  download:  
    runs-on: ubuntu-latest  
    steps:  
      - name: 下载文件  
        run: wget -O ALL.m3u8 "https://iptv.wwkejishe.top/ALL.m3u8"  
      - name: 提交文件  
        run: |  
          git config --global user.email "you@example.com"  
          git add file.txt  
          git commit -m "Update file"  
          git push  
