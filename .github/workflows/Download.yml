name: Download Workflow
on: 
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *" # 每天 UTC 18 点执行

jobs:
  download-and-upload:
    runs-on: ubuntu-latest
    steps:
      # 1. 检出仓库代码
      - uses: actions/checkout@v4  # ‌:ml-citation{ref="2,4" data="citationList"}
      
      # 2. 设置工作目录
      - name: 创建下载目录
        run: mkdir -p Download

      # 3. 下载文件
      - name: 下载目标文件
        run: |
          wget -O Download/wwkejishe.m3u8 https://iptv.wwkejishe.top/ALL.m3u8
          wget -O Download/iptv-api.txt https://raw.githubusercontent.com/Guovin/iptv-api/gd/output/result.txt
          wget -O Download/CCTV.m3u https://raw.githubusercontent.com/Moexin/IPTV/Files/CCTV.m3u
          wget -O Download/CNTV.m3u https://raw.githubusercontent.com/Moexin/IPTV/Files/CNTV.m3u
          wget -O Download/suxuang.m3u https://raw.githubusercontent.com/suxuang/myIPTV/main/ipv6.m3u
          wget -O Download/merged_output.txt https://raw.githubusercontent.com/kimwang1978/collect-tv-txt/main/merged_output.txt
          wget -O Download/l.txt https://raw.githubusercontent.com/asdjkl6/tv/tv/.m3u/整套直播源/测试/整套直播源/l.txt
          wget -O Download/kk.txt https://raw.githubusercontent.com/asdjkl6/tv/tv/.m3u/整套直播源/测试/整套直播源/kk.txt
          wget -O Download/yuanzl77.txt https://raw.githubusercontent.com/yuanzl77/IPTV/master/live.txt
          wget -O Download/fanmingming_ipv6.m3u https://raw.githubusercontent.com/fanmingming/live/main/tv/m3u/ipv6.m3u
          wget -O Download/vbskycn_iptv6.txt https://raw.githubusercontent.com/vbskycn/iptv/master/tv/iptv6.txt
          wget -O Download/vbskycn_iptv4.txt https://raw.githubusercontent.com/vbskycn/iptv/master/tv/iptv4.txt
          wget -O Download/YueChan.m3u https://raw.githubusercontent.com/YueChan/Live/main/APTV.m3u

     # 4. 上传 Artifact
      - name: 上传文件为 Artifact
        uses: actions/upload-artifact@v4  # ‌:ml-citation{ref="1,2" data="citationList"}
        with:
          name: downloaded-files
          path: Download/ALL.m3u8  # 指定具体文件

      # 5. 提交文件到仓库（自动化提取）
      - name: 提交文件到仓库
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add Download/*
          git commit -m "[skip ci] 自动更新 Artifact 文件"
          git push origin main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
