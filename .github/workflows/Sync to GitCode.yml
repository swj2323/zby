name: Sync to GitCode

on:
  schedule:
    - cron: '0 0 * * *'  # 每天 UTC 时间 00:00 执行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整的提交历史

      - name: Set up SSH keys
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITCODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitcode.com >> ~/.ssh/known_hosts

      - name: Add GitCode remote
        run: |
          git remote add gitcode git@gitcode.com:swj2323/live.git

      - name: Push to GitCode
        run: |
          git config --global user.name "swj2323"
          git config --global user.email "656556071@qq.com"
          git push --mirror gitcode
