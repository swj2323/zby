name: Sync to Gitee  
on:  
  workflow_dispatch:  
  schedule:  
    - cron: '0 19 * * *'  # UTC 19:00 → 北京时间凌晨 3:00‌:ml-citation{ref="1" data="citationList"}  

jobs:  
  sync-directory:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout Full Repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0  # 保留完整提交历史‌:ml-citation{ref="1" data="citationList"}  

      - name: Prepare Download directory
        run: |
          mkdir -p sync_temp
          cp -R Download/ sync_temp/
          cd sync_temp
          git init
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          git add .
          git commit -m "Auto-sync Download directory"  

      - name: Setup Git Config  
        run: |  
          git config --global user.email "656556071@qq.com"  
          git config --global user.name "毁在右手上"  

      - name: Force Push to Gitee  
        env:  
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}  # 需配置写入权限 Token‌:ml-citation{ref="1" data="citationList"}  
        run: |  
          git remote add gitee https://oauth2:$GITEE_TOKEN@gitee.com/weijun_sun/live.git  
          git add .  # 添加所有保留文件‌:ml-citation{ref="3" data="citationList"}  
          git commit -m "Auto-sync Download directory"  
          git push gitee HEAD:master --force  
