name: Sync Specific Directory to Gitee  
on:  
  workflow_dispatch:  
  schedule:  
    - cron: '0 19 * * *'  

jobs:  
  sync-directory:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout Full Repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0  

      - name: Filter Download Directory  
        run: |  
          find . -mindepth 1 -maxdepth 1 ! -name 'Download' ! -name '.github' ! -name '.git' -exec rm -rf {} +  
          ls -la Download/  

      - name: Configure SSH Key  
        env:  
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}  
        run: |  
          mkdir -p ~/.ssh  
          echo "$GITEE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519  
          chmod 600 ~/.ssh/id_ed25519  
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts  

      - name: Setup Git Config  
        run: |  
          git config --global user.email "656556071@qq.com"  
          git config --global user.name "毁在右手上"  

      - name: Force Push to Gitee  
        run: |  
          git remote add gitee git@gitee.com:weijun_sun/zby.git  
          git add .  
          git commit -m "Auto-sync Download directory"  
          git push gitee HEAD:main --force  
