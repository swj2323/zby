name: Sync TV Directory to GitCode
on:
  workflow_dispatch:  # 支持手动触发
  schedule:
    - cron: '20 07,19 * * *'  # UTC 时间（北京时间凌晨3点/下午3点）

jobs:
  sync-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITCODE_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_ed25519
          echo -e "Host gitcode.com\n  Hostname gitcode.com\n  Port 22" > ~/.ssh/config
          ssh-keyscan -t ed25519 gitcode.com >> ~/.ssh/known_hosts

      - name: Setup Git Identity
        run: |
          git config --global user.name "swj2323"
          git config --global user.email "656556071@qq.com"

      - name: Prepare TV Directory
        run: |
          git add TV/
          git commit -m "Auto-sync TV directory" || echo "No changes to commit"

      - name: Test Repository Access  # 新增权限验证
        run: git ls-remote git@gitcode.com:swj2323/live.git

      - name: Force Push via SSH
        run: |
          git remote remove gitcode || true
          git remote add gitcode git@gitcode.com:swj2323/live.git
          git push gitcode HEAD:main --force
