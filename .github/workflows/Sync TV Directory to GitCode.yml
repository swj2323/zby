name: Sync TV Directory to GitCode
on:
  workflow_dispatch:
  schedule:
    - cron: '20 07,19 * * *'

jobs:
  sync-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITCODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan gitcode.com >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: ssh -T git@gitcode.com

      - name: Setup Git Identity
        run: |
          git config --global user.name "swj2323"
          git config --global user.email "656556071@qq.com"

      - name: Prepare TV Directory
        run: |
          git add TV/
          if git diff-index --quiet HEAD --; then
            echo "无变更可提交"
          else
            git commit -m "Auto-sync TV directory"
          fi

      - name: Force Push to GitCode
        env:
          GIT_TRACE: 1
          GIT_SSH_COMMAND: "ssh -v"
        run: |
          git remote add gitcode git@gitcode.com:git@gitcode.com:swj2323/live.git || true
          git push gitcode HEAD:main --force -v
