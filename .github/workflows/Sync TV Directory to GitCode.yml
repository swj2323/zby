name: Sync TV Directory to GitCode
on:
  workflow_dispatch:
  schedule:
    - cron: '20 07,19 * * *'  # UTC 时间，对应北京时间凌晨3点和下午3点

jobs:
  sync-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH (RSA 2048 专用修复)
        run: |
          mkdir -p ~/.ssh
          # 清理旧配置
          rm -f ~/.ssh/id_rsa ~/.ssh/known_hosts
          
          # 写入 RSA 2048 私钥（处理换行符）
          echo "${{ secrets.GITCODE_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_rsa
          
          # 严格权限控制
          chmod 700 ~/.ssh
          chmod 600 ~/.ssh/id_rsa
          
          # 配置 SSH 连接参数
          echo -e "Host gitcode.com\n  Hostname gitcode.com\n  Port 22\n  User git\n  IdentityFile ~/.ssh/id_rsa" > ~/.ssh/config
          
          # 注册服务器指纹（强制 RSA 类型）
          ssh-keyscan -t rsa gitcode.com >> ~/.ssh/known_hosts
          
          # 调试输出密钥头尾
          echo "=== RSA 私钥头尾 ==="
          head -n 3 ~/.ssh/id_rsa
          tail -n 3 ~/.ssh/id_rsa

      - name: Setup Git Identity
        run: |
          git config --global user.name "swj2323"
          git config --global user.email "656556071@qq.com"

      - name: Prepare TV Directory
        run: |
          git add TV/
          git commit -m "Auto-sync TV directory" || echo "No changes to commit"

      - name: Test SSH Connection (前置验证)
        run: ssh -T git@gitcode.com

      - name: Force Push via SSH
        run: |
          git remote remove gitcode || true
          git remote add gitcode git@gitcode.com:swj2323/live.git
          git push gitcode HEAD:main --force
