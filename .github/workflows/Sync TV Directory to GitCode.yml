name: Sync TV Directory to GitCode
on:
  workflow_dispatch:
  schedule:
    - cron: '20 07,19 * * *'

jobs:
  sync-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Full Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITCODE_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          # 修复 Hostname 为 gitcode.com
          echo -e "Host gitcode.com\n  Hostname gitcode.com\n  Port 443" >> ~/.ssh/config
          # 修正 ssh-keyscan 目标
          ssh-keyscan -p 443 gitcode.com >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: ssh -T git@gitcode.com

      - name: Setup Git Identity
        run: |
          git config --global user.name "swj2323"
          git config --global user.email "656556071@qq.com"

      - name: Prepare TV Directory
        run: |
          git add -A TV/
          if ! git diff-index --quiet HEAD --; then
            git commit -m "Auto-sync TV directory - $(date -u '+%Y-%m-%d %H:%M:%S')"
          else
            echo "无变更可提交"
          fi

      - name: Force Push to GitCode
        env:
          GIT_TRACE: 1
          GIT_SSH_COMMAND: "ssh -v"
        run: |
          git remote add gitcode git@gitcode.com:swj2323/live.git || true
          git push gitcode HEAD:main --force
