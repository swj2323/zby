name: IPTV AutoSync Workflow
on:
  workflow_dispatch:
  schedule:
    - cron: "0 11,23 * * *" # 每天UTC时间18点（北京时间次日2点）

jobs:
  sync-iptv-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 允许提交代码

    steps:
      # 步骤1：检出仓库代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 获取完整提交历史

      # 步骤2：创建下载目录
      - name: Create TV directory
        run: mkdir -p TV # 更改下载目录为“TV”

      # 步骤3：下载IPTV源文件
      - name: Download IPTV sources
        run: |
          wget -q -O TV/iptv.m3u https://raw.githubusercontent.com/swj2323/iptv-api/refs/heads/master/output/iptv.m3u
          wget -q -O TV/iptv.txt https://raw.githubusercontent.com/swj2323/iptv-api/refs/heads/master/output/iptv.txt

      # 步骤4：自动提交更新
      - name: Commit changes
        run: |
          git config --global user.name "IPTV Sync Bot"
          git config --global user.email "iptv-sync@noreply.github.com"

          # 检测文件变化
          if git diff --quiet --exit-code; then
            echo "没有检测到文件变化"
          else
            git add TV
            git commit -m "📡 AutoSync IPTV Sources [$(date +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤5：上传构建产物（可选）
      - name: Upload artifact
        if: ${{ always() }} # 即使失败也上传
        uses: actions/upload-artifact@v4
        with:
          name: iptv-sources-${{ github.run_id }}
          path: TV/
          retention-days: 3
