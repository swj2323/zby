name: IPTV AutoSync Workflow
on:
  workflow_dispatch:
  schedule:
    - cron: "0 17 * * *"  # UTC时间17点（北京时间次日1点）

jobs:
  sync-iptv-sources:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 必要写入权限
      actions: read    # 附加权限保障

    steps:
      # 步骤1：检出代码（显式指定分支）
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main  
          fetch-depth: 0

      # 步骤2：创建目录
      - name: Create TV directory
        run: mkdir -p TV  # 修正目录名称

      # 步骤3：下载文件（添加超时和重试机制）
      - name: Download IPTV sources
        timeout-minutes: 5
        run: |
          wget --tries=3 --timeout=30 -q -O TV/tv.m3u \
            https://raw.githubusercontent.com/swj2323/iptv-api/master/output/tv.m3u
          wget --tries=3 --timeout=30 -q -O TV/tv.txt \
            https://raw.githubusercontent.com/swj2323/iptv-api/master/output/tv.txt
          wget --tries=3 --timeout=30 -q -O TV/my_tv.m3u \
            https://raw.githubusercontent.com/sweijun/iptv-api/master/output/my_tv.m3u
          wget --tries=3 --timeout=30 -q -O TV/my_tv.txt \
            https://raw.githubusercontent.com/sweijun/iptv-api/master/output/my_tv.txt
          wget --tries=3 --timeout=30 -q -O TV/wwkejishe.m3u \
            https://raw.githubusercontent.com/swj2323/m3ufiles/refs/heads/main/Download/wwkejishe.m3u
          wget --tries=3 --timeout=30 -q -O TV/iptv-api.txt \
            https://raw.githubusercontent.com/swj2323/m3ufiles/refs/heads/main/Download/iptv-api.txt
          wget --tries=3 --timeout=30 -q -O TV/epg.gz \
            https://raw.githubusercontent.com/swj2323/iptv-api/master/output/epg/epg.gz
          wget --tries=3 --timeout=30 -q -O TV/epg.xml \
            https://raw.githubusercontent.com/swj2323/iptv-api/master/output/epg/epg.xml
          wget --tries=3 --timeout=30 -q -O TV/fy.xml \
            https://epg.v1.mk/fy.xml

      # 步骤4：批量替换文件内容
      - name: Replace URLs
        run: |
          sed -i 's|https://raw.githubusercontent.com/sweijun/iptv-api/refs/heads/master/output/epg/epg.xml|https://gitee.com/weijun_sun/live/raw/master/TV/epg.xml|g' TV/my_tv.m3u TV/tv.m3u
          sed -i 's|https://raw.githubusercontent.com/sweijun/iptv-api/refs/heads/master/output/epg/epg.gz|https://gitee.com/weijun_sun/live/raw/master/TV/epg.gz|g' TV/my_tv.m3u TV/tv.m3u
          sed -i 's|https://raw.githubusercontent.com/fanmingming/live/main/tv/|https://gitee.com/weijun_sun/icon/raw/master/png/|g' TV/my_tv.m3u TV/tv.m3u

      # 步骤5：提交变更（优化检测逻辑）
      - name: Commit changes
        run: |
          git config --global user.name "IPTV Sync Bot"
          git config --global user.email "iptv-sync@noreply.github.com"

          # 双重检测机制‌:ml-citation{ref="4,5" data="citationList"}
          if [ -n "$(git status --porcelain)" ]; then
            git add TV/*
            git commit -m "📡 AutoSync IPTV Sources [$(date +'%Y-%m-%d %H:%M UTC')]"
            git push origin main
          else
            echo "未检测到文件变化"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 步骤5：产物上传（路径修正）
      - name: Upload artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: iptv-sources-${{ github.run_id }}
          path: TV/
          retention-days: 3
