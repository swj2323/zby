name: Media File Processor
on: 
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'  # 每日UTC时间3点执行

jobs:
  process-files:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # 最小化权限原则

    steps:
    # --------------------------
    # 阶段1：安全代码检出
    # --------------------------
    - name: Checkout code
      uses: actions/checkout@v4  # 官方最新稳定版
      with:
        fetch-depth: 1
        sparse-checkout: |      # 文件操作白名单
          *.m3u
          *.m3u8
          *.txt

    # --------------------------
    # 阶段2：文件处理核心逻辑
    # --------------------------
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y gsed findutils  # 基础工具链

    - name: Execute replacement
      run: |
        set -eo pipefail  # 严格错误检测
        
        # 安全查找与替换（POSIX兼容）
        find . -type f $ \
          -name '*.m3u' -o \
          -name '*.m3u8' -o \
          -name '*.txt' $ \
          -exec gsed -i -E \
            -e 's/CCTV[[:space:]-]+/CCTV/g' \
            -e 's/CGTN(记录|紀錄)/CGTN紀录/g' \
            {} +
        
        # 校验修改文件数（防止误操作）
        changed_files=$(git diff --name-only | wc -l)
        if [ $changed_files -eq 0 ]; then
          echo "::warning::未检测到有效变更"
        fi

    # --------------------------
    # 阶段3：结果提交
    # --------------------------
    - name: Create Pull Request
      uses: peter-evans/create-pull-request@v5  # 已验证可用版本
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: file-refactor-$(date +%s)
        delete-branch: true
        commit-message: |
          chore: [自动化] 媒体文件标准化
          * 统一频道命名格式
          * 修正纪录片名称
        title: "媒体文件标准化更新 ($(date +%F))"
        body: |
          ### 变更详情
          - 完成CCTV格式标准化
          - 统一简繁体纪录片名称
          - 影响文件类型：`.m3u`, `.m3u8`, `.txt`

    # --------------------------
    # 阶段4：错误追踪
    # --------------------------
    - name: Post-process
      if: ${{ failure() }}
      run: |
        # 生成诊断日志
        journalctl -u github-actions --since "5 minutes ago" > action_errors.log
        echo "退出代码: ${{ job.status }}" >> exit_codes.log
        
        # 上传错误报告
        gh run upload action_errors.log exit_codes.log
