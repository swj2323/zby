name: Auto-Update Keywords

on:
  schedule:
    - cron: '0 0 * * *'  # 每日UTC时间0点（北京时间8:00）
  workflow_dispatch:

jobs:
  keyword-replacement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Perform replacements
      run: |
        cd Download  # 关键路径修改
        find . -type f $ -name "*.m3u" -o -name "*.m3u8" -o -name "*.txt" $ -print0 | xargs -0 sed -i.bak \
          -e 's/CCTV-/CCTV/g' \
          -e 's/CCTV /CCTV/g' \
          -e 's/CGTN记录/CGTN纪录/g'
        find . -name "*.bak" -delete || true

    - name: Check changes
      id: check_changes
      run: |
        git config --global core.safecrlf false
        if ! git diff --quiet --exit-code; then
          echo "changed=true" >> $GITHUB_OUTPUT
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add -A
        git commit -m "🤖 自动替换关键字 - $(date +'%Y-%m-%d')"
        git push origin HEAD:$(echo $GITHUB_REF | cut -d'/' -f3)
