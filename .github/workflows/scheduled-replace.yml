name: Auto-Update Keywords

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keyword-replacement:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write  # 新增权限
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        path: ./Download  # 精确指定路径

    - name: Debug path
      run: |
        echo "当前工作目录: $(pwd)"
        ls -la ./Download

    - name: Perform replacements
      run: |
        cd ./Download || exit 1
        # 安全执行模式
        set +eo pipefail
        find . -type f $ -name "*.m3u" -o -name "*.m3u8" -o -name "*.txt" $ \
          -exec sed -i.bak \
          -e 's/CCTV-/CCTV/g' \
          -e 's/CCTV /CCTV/g' \
          -e 's/CGTN记录/CGTN纪录/g' {} + \
          || echo "忽略无文件错误"
        find . -name "*.bak" -delete 2>/dev/null || true
        set -eo pipefail

    - name: Check changes
      id: check_changes
      run: |
        git config --global --add safe.directory /github/workspace/Download
        if ! git diff --quiet --exit-code -- ./Download; then
          echo "changed=true" >> $GITHUB_OUTPUT
          git status --porcelain >> changes.log
        else
          echo "changed=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add ./Download/
        git commit -m "🤖 自动更新-$(date +'%Y%m%d')"
        git push origin HEAD:${{ github.ref_name }} --force-with-lease
