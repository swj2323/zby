name: Media File Standardization
on:
  schedule:
    - cron: '0 3 * * *'  # UTC时间
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  media-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Shanghai  # 2023兼容语法

    steps:
    # --------------------------
    # 阶段1：安全代码库初始化
    # --------------------------
    - name: Checkout Code
      uses: actions/checkout@v4  # 实际存在的最新稳定版
      with:
        fetch-depth: 3
        persist-credentials: false

    # --------------------------
    # 阶段2：文件处理核心逻辑
    # --------------------------
    - name: Install GNU Sed
      run: sudo apt-get install -y gsed

    - name: Execute Pattern Replacement
      run: |
        find . -type f $ \
          -name '*.m3u' -o \
          -name '*.m3u8' -o \
          -name '*.txt' $ \
          -exec gsed -i -E \
            -e 's/CCTV[[:space:]-]+/CCTV/g' \  # 2023兼容正则
            -e 's/CGTN(记录|紀錄)/CGTN紀录/g' \
            {} +

    # --------------------------
    # 阶段3：PR生成（现有版本）
    # --------------------------
    - name: Create Standardized PR
      uses: peter-evans/create-pull-request@v5  # 已发布的最新版
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: refactor/media-$(date +%s)
        delete-branch: true
        commit-message: |
          chore: [Bot] 媒体文件标准化
          * 统一CCTV格式
          * 规范纪录片名称
        title: "[自动化] 媒体关键字标准化 ($(date +%F))"

    # --------------------------
    # 阶段4：基础验证
    # --------------------------
    - name: Verify Changes
      if: always()
      run: |
        git diff --name-only HEAD^ | grep -E '\.(m3u|m3u8|txt)$'
