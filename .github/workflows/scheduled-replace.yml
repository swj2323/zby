name: Auto-Update Keywords

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  keyword-replacement:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Perform replacements
      run: |
        find . -type $ -name "*.m3u" -o -name "*.m3u8" -o -name "*.txt" $ -exec sed -i.bak \
        -e 's/CCTV-/CCTV/g' \
        -e 's/CCTV /CCTV/g' \
        -e 's/CGTN记录/CGTN纪录/g' {} \;
        find . -name "*.bak" -delete

    - name: Check changes
      id: check_changes
      run: |
        if git diff --exit-code; then
          echo "changed=false" >> $GITHUB_OUTPUT
        else
          echo "changed=true" >> $GITHUB_OUTPUT
        fi

    - name: Commit changes
      if: steps.check_changes.outputs.changed == 'true'
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add -A
        git commit -m "🤖 自动替换关键字 - 2025-02-26更新"
        git push
