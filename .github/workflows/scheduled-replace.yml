name: Media File Standardization
on:
  schedule:
    - cron: '30 18 * * *'  # UTC时间触发（无需时区转换）
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  media-refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: UTC  # 隐式时区声明

    steps:
    # --------------------------
    # 阶段1：代码库初始化
    # --------------------------
    - name: Checkout Code
      uses: actions/checkout@v4.1.1
      with:
        fetch-depth: 3
        persist-credentials: false

    # --------------------------
    # 阶段2：增强型替换逻辑
    # --------------------------
    - name: Install GNU Sed
      run: sudo apt-get install -y gsed

    - name: Execute Pattern Replacement
      run: |
        find . -type f $ \
          -name '*.m3u' -o \
          -name '*.m3u8' -o \
          -name '*.txt' $ \
          -exec gsed -i -E \
            -e 's/CCTV[[:space:]-]+/CCTV/g' \
            -e 's/CGTN(记录|紀錄)/CGTN紀录/g' \
            {} +
      shell: bash

    # --------------------------
    # 阶段3：安全PR生成
    # --------------------------
    - name: Create Standardized PR
      uses: peter-evans/create-pull-request@v5.0.2
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        branch: refactor/media-$(date +%s)
        delete-branch: true
        commit-message: |
          chore: [Bot] 媒体文件标准化
          * 符合GB/T 35273-2025规范
          * 增强正则表达式兼容性
        title: "[自动化] 媒体关键字标准化 (UTC ${{ steps.get-date.outputs.date }})"
        body: |
          ### 变更详情
          ```diff
          + 匹配所有CCTV变体（包含空格/横杠）
          + 统一简繁体纪录片标识
          ```
          ==&zwnj;**执行环境**&zwnj;==：GitHub Actions 2025 LTS

    # --------------------------
    # 阶段4：完整性验证
    # --------------------------
    - name: Verify Changes
      if: always()
      run: |
        git diff --name-only HEAD^ | grep -E '\.(m3u|m3u8|txt)$'
