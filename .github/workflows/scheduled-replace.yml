name: Auto-Update Keywords

on:
  schedule:
    - cron: '0 0 * * *'  # 每天UTC时间00:00运行
  workflow_dispatch:     # 手动触发选项

jobs:
  keyword-replacement:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Perform replacements
      run: |
        # 批量替换操作（兼容Linux/macOS环境）
        find . -type $ -name "*.m3u" -o -name "*.m3u8" -o -name "*.txt" $ -exec sed -i.bak \
        -e 's/CCTV-/CCTV/g' \
        -e 's/CCTV /CCTV/g' \
        -e 's/CGTN记录/CGTN纪录/g' {} \; 
        find . -name "*.bak" -delete  # 清理备份文件

    - name: Commit changes
      if: "! git diff --exit-code"
      run: |
        git config --global user.name "GitHub Actions"
        git config --global user.email "actions@github.com"
        git add -A
        git commit -m "🤖 自动替换关键字 - 2025-02-26更新"
        git push
