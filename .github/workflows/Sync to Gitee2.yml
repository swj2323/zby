name: Sync to Gitee Excluding .github

on:
  workflow_dispatch:
  schedule:
    - cron: '0 19 * * *'

jobs:
  sync-to-gitee:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 保留完整的 Git 历史记录
          sparse-checkout: |
            /*
            !.github  # 排除 .github 目录

      - name: Prepare Sync Directory
        run: |
          mkdir -p sync_temp
          # 使用 rsync 复制除 .github 外的所有内容到 sync_temp 目录
          rsync -av --exclude='.github' --exclude='.git*' . sync_temp/
          cd sync_temp
          git init
          git config --local user.name "GitHub Actions"
          git config --local user.email "github-actions@github.com"
          git add .
          # 提交时排除任何可能的 .git* 残留文件
          git commit -m "Auto-sync from GitHub Actions excluding .github"

      - name: Force Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}  # 需要在仓库的 Secrets 中配置 GITEE_TOKEN
        run: |
          cd sync_temp
          # 设置 Gitee 远程仓库并强制推送 HEAD 到 master 分支
          git remote add gitee https://oauth2:$GITEE_TOKEN@gitee.com/weijun_sun/live.git
          git push gitee HEAD:master --force
