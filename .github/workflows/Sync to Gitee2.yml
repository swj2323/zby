name: Sync to Gitee2

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 19 * * *'  # 定时触发，UTC 时间 19:00

jobs:
  sync-directory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 检出所有历史提交
          sparse-checkout: |
            /*
            !.github  # 排除 .github 目录

      - name: Prepare Sync Directory
        run: |
          mkdir -p sync_temp
          # 使用 rsync 复制除 .github 外的所有内容到 sync_temp 目录
          rsync -av --exclude='.github' . sync_temp/
          cd sync_temp
          git init

      - name: Configure Git User
        run: |
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
        working-directory: ./sync_temp

      - name: Add and Commit Files
        run: |
          git add .
          git commit -m "Auto-sync from GitHub Actions"
        working-directory: ./sync_temp

      - name: Force Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}  # 需要在仓库的 Secrets 中配置 GITEE_TOKEN
        run: |
          git remote add gitee https://oauth2:$GITEE_TOKEN@gitee.com/weijun_sun/live.git
          git push gitee HEAD:master --force
        working-directory: ./sync_temp
