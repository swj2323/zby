name: Sync Download Directory to Gitee  
on:  
  workflow_dispatch:  
  schedule:  
    - cron: '0 19 * * *'  

jobs:  
  sync-download:  
    runs-on: ubuntu-latest  
    steps:  
      - name: Checkout Repository  
        uses: actions/checkout@v4  
        with:  
          fetch-depth: 0  

      - name: Filter Download Directory  
        run: |  
          find . -mindepth 1 -maxdepth 1 ! -name 'Download' ! -name '.git' -exec rm -rf {} +  
          ls -la Download/  

      - name: Configure SSH  
        env:  
          GITEE_SSH_PRIVATE_KEY: ${{ secrets.GITEE_SSH_PRIVATE_KEY }}  
        run: |  
          mkdir -p ~/.ssh  
          echo "$GITEE_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519  
          chmod 600 ~/.ssh/id_ed25519  
          ssh-keyscan gitee.com >> ~/.ssh/known_hosts  

      - name: Configure Git  
        run: |  
          git config --global user.email "github-actions@example.com"  
          git config --global user.name "${{ secrets.GITEE_USERNAME }}"  

      - name: Push to Gitee  
        run: |  
          git remote add gitee git@gitee.com:weijun_sun/zby.git  # 改用SSH地址‌:ml-citation{ref="2,3" data="citationList"}  
          git add Download/  
          git status  
          git commit -m "Sync Download directory" --allow-empty  
          git push gitee HEAD:main --force  
