name: Sync Download Directory to Gitee

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 19 * * *'  # 北京时间凌晨3点触发

jobs:
  sync-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Download directory for sync
        run: |
          mkdir -p sync_temp
          cp -R Download/ sync_temp/
          cd sync_temp
          git init
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "github-actions-bot@example.com"
          git add .
          # 创建一个临时的提交，以便我们可以推送到 Gitee
          git commit -m "Temporary commit for syncing Download directory"

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO_URL: https://gitee.com/weijun_sun/zby.git
        run: |
          # 由于我们之前已经在 sync_temp 目录中初始化了 Git，并创建了一个提交
          # 我们现在可以直接将这个目录作为一个分支推送到 Gitee
          # 但是，由于我们只想同步 Download 目录，并且不想在 Gitee 上保留完整的 Git 历史
          # 我们将使用 force push 来覆盖 Gitee 上的目标分支（假设为 main-download）
          # 注意：force push 会重写目标分支的历史，请谨慎使用
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:${{ secrets.GITEE_TOKEN }}@${{ env.GITEE_REPO_URL }}
          # 推送当前分支（即包含 Download 目录的临时分支）到 Gitee 的目标分支
          # 这里假设目标分支名为 main-download，你可以根据需要更改
          git push --force gitee HEAD:main-download
