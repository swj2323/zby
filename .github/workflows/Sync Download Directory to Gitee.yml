name: Sync to Gitee
on:
  schedule:
    - cron: '0 19 * * *'  # 北京时间凌晨3点
  workflow_dispatch:  # 支持手动触发

jobs:
  sync-download:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare Download directory
        run: |
          mkdir -p sync_temp
          cp -R Download/ sync_temp/
          cd sync_temp
          git init
          git config --local user.name "GitHub Actions Bot"
          git config --local user.email "actions@github.com"
          git add .
          git commit -m "Auto-sync Download directory"

      - name: Push to Gitee
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          git remote add gitee https://${{ secrets.GITEE_USERNAME }}:$GITEE_TOKEN@gitee.com/weijun_sun/zby.git
          git fetch gitee  # 拉取远程分支最新状态
          git push gitee HEAD:main-download  # 无冲突时直接推送
